# OpenShift Routes — the Router (HAProxy) terminates TLS and forwards plain HTTP/WS to the pod.
# Both routes share the same hostname; the WS route claims path /ws so the browser
# sends the auth cookie (which is scoped to the hostname, not a subdomain) on the
# WebSocket upgrade without any extra cookie-domain configuration.

# ── App traffic (HTTP → HTTPS, edge TLS termination) ──────────────────────────
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mgo-backend
  namespace: 7372268-test
spec:
  host: mgo-backend-7372268-test.apps.rtpfs-wpp2.wpp.nam.gm.com
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: mgo-backend-service
    weight: 100

---

# ── WebSocket traffic (WS → WSS, edge TLS termination) ────────────────────────
# Same hostname as the HTTP route so auth cookies are included on the WS handshake.
# Path /ws routes to the WS service; HAProxy strips nothing by default, but
# tokio-tungstenite accepts any path so no backend change is needed.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mgo-backend-ws
  namespace: 7372268-test
  annotations:
    haproxy.router.openshift.io/timeout: 24h
spec:
  host: mgo-backend-7372268-test.apps.rtpfs-wpp2.wpp.nam.gm.com
  path: /ws
  port:
    targetPort: ws
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: None
  to:
    kind: Service
    name: mgo-backend-service
    weight: 100
