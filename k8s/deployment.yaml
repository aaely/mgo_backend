apiVersion: apps/v1
kind: Deployment
metadata:
  name: mgo-backend
  namespace: 7372268-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mgo-backend
  template:
    metadata:
      labels:
        app: mgo-backend
    spec:
      serviceAccountName: mgo-backend
      # Pulling from this namespace's own internal registry — OpenShift auto-grants
      # pull access to service accounts in the same namespace, no imagePullSecrets
      # needed. Only add one back if you switch to an external registry:
      # oc create secret docker-registry mgo-backend-pull-secret \
      #   --docker-server=<your-registry> --docker-username=<user> \
      #   --docker-password=<password> -n 7372268-test
      # Let OpenShift assign the arbitrary UID from the namespace's allocated
      # range (default restricted SCC rejects a pinned runAsUser like 1001).
      # It's always in group 0, which is what the Dockerfile's chown/chmod g=u
      # relies on — no runAsUser needed here.
      securityContext:
        runAsNonRoot: true
        fsGroup: 0
      containers:
        - name: mgo-backend
          image: image-registry.openshift-image-registry.svc:5000/7372268-test/mgo-backend:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false   # rocket writes nothing to /; flip to true if needed
          ports:
            - containerPort: 8000   # HTTP
            - containerPort: 9001   # WS (plain)
            # Uncomment if USE_HTTPS=true (pod-level TLS, bypasses Route TLS termination)
            # - containerPort: 8443  # HTTPS / WSS
          envFrom:
            - configMapRef:
                name: mgo-backend-config
            - secretRef:
                name: mgo-backend-secret
          volumeMounts:
            # Internal CA cert(s) for trusting LDAP_URL=ldaps://... — only
            # needed if your AD domain controller's cert isn't from a public
            # CA. See k8s/README notes for how mgo-backend-ca-certs gets created.
            - name: ca-certs
              mountPath: /usr/local/share/ca-certificates/custom
              readOnly: true
          # TLS cert volume — only needed when USE_HTTPS=true
          # volumeMounts:
          #   - name: tls-certs
          #     mountPath: /app/cert.pem
          #     subPath: tls.crt
          #   - name: tls-certs
          #     mountPath: /app/key.pem
          #     subPath: tls.key
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: ca-certs
          secret:
            secretName: mgo-backend-ca-certs
            optional: true   # pod still starts fine if you haven't created this yet
      # volumes:
      #   - name: tls-certs
      #     secret:
      #       secretName: mgo-tls-secret
