apiVersion: v1
kind: Secret
metadata:
  name: mgo-backend-secret
  namespace: 7372268-test          # ← your namespace
type: Opaque
stringData:
  NEO4J_PASSWORD: "changeme"            # ← Neo4j password
  JWT_SECRET: "changeme"                # ← any long random string
  LDAP_URL: "ldaps://your-dc.corp.com:636"  # ← your Domain Controller
  LDAP_DOMAIN: "corp.com"              # ← your AD domain
  LDAP_BIND_DN: "CN=svc_app,OU=ServiceAccounts,DC=corp,DC=com"  # ← service account
  LDAP_BIND_PASSWORD: "changeme"       # ← service account password
  SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/CHANGE/ME/TOO"  # ← acts as a bearer credential, treat like a password
  SMTP_HOST: "smtp.example.com"        # ← your SMTP relay
  SMTP_PORT: "25"                      # ← your SMTP port
  SMTP_USER: "your_smtp_username"      # ← leave both USER and PASS blank if your relay doesn't need auth
  SMTP_PASS: "changeme"
  EMAIL_FROM: "noreply@example.com"    # ← From: address for outgoing mail
  ALERT_EMAIL: "alerts@example.com"    # ← recipient for automated part/trailer alerts (src/services.rs); leave unset to skip email alerts
