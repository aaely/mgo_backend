apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: 7372268-test          # ← your namespace
type: Opaque
stringData:
  # Required by the Redis nodes and the sentinels alike. Anyone who can publish
  # to this Redis can push messages to every open screen, so treat it like the
  # other secrets.
  # ← Letters and digits only (it is written into config files as-is):
  #     openssl rand -hex 24
  # ← Keep in sync with REDIS_PASSWORD in secret.yaml (mgo-backend-secret) —
  #   two separate Secret objects with no automatic link between them.
  REDIS_PASSWORD: "changeme"
