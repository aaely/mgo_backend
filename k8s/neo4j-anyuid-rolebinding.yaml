# OPTIONAL FALLBACK — do not apply this unless you need it.
#
# neo4j-deployment.yaml mounts /data, /logs, and /conf as volumes specifically
# so it can run under OpenShift's default restricted SCC (arbitrary UID,
# auto-assigned fsGroup) with no special privileges. That should be enough for
# the vanilla neo4j:5-community image.
#
# If the pod still crash-loops with a permission-denied error on some other
# path (e.g. a plugin directory you've added, or a future image version that
# writes somewhere new), the two options are: (a) mount an emptyDir over that
# specific path too, or (b) apply this RoleBinding as a last resort. It's the
# declarative equivalent of:
#   oc adm policy add-scc-to-user anyuid -z neo4j -n mgo
# and requires a user/SA with permission to grant SCCs (usually cluster-admin
# or a delegated admin) — same requirement as the oc command.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: neo4j-anyuid
  namespace: mgo
subjects:
  - kind: ServiceAccount
    name: neo4j
    namespace: mgo
roleRef:
  kind: ClusterRole
  name: system:openshift:scc:anyuid
  apiGroup: rbac.authorization.k8s.io
