apiVersion: v1
kind: Secret
metadata:
  name: neo4j-secret
  namespace: 7372268-test          # ← your namespace
type: Opaque
stringData:
  # Official image's format: "<user>/<password>". User is always "neo4j" for
  # community edition (single default admin account).
  # ← Keep this password in sync with NEO4J_PASSWORD in mgo-backend-secret.yaml —
  #   they're two separate Secret objects with no automatic link between them.
  NEO4J_AUTH: "neo4j/Asdf123$"
