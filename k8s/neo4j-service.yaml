apiVersion: v1
kind: Service
metadata:
  name: neo4j-service   # ← matches NEO4J_URI in mgo-backend-config already
  namespace: mgo
spec:
  selector:
    app: neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
  type: ClusterIP
