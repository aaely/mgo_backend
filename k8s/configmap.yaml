apiVersion: v1
kind: ConfigMap
metadata:
  name: mgo-backend-config
  namespace: mgo          # ← your namespace
data:
  NEO4J_URI: "bolt://neo4j-service:7687"           # ← Neo4j bolt address (in-cluster service or external)
  NEO4J_USER: "neo4j"
  LDAP_BASE_DN: "DC=corp,DC=com"                   # ← your AD base DN
  LDAP_USER_SEARCH_BASE: "OU=Users,DC=corp,DC=com" # ← where users live in AD
  USE_HTTPS: "false"                                # "false" = OpenShift Router terminates TLS; "true" = pod-level TLS (passthrough Route)
