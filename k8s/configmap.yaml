apiVersion: v1
kind: ConfigMap
metadata:
  name: mgo-backend-config
  namespace: 7372268-test          # ← your namespace
data:
  NEO4J_URI: "bolt://neo4j-service:7687"           # ← Neo4j bolt address (in-cluster service or external)
  NEO4J_USER: "neo4j"
  LDAP_BASE_DN: "DC=corp,DC=com"                   # ← your AD base DN
  LDAP_USER_SEARCH_BASE: "OU=Users,DC=corp,DC=com" # ← where users live in AD
  # AD group DN -> app role. A user must be a member of one of these to log
  # in at all — no match means login is denied. If a user is in more than
  # one, the highest-privilege role wins (admin > manager > floater > mfu).
  LDAP_GROUP_ADMIN:   "CN=MODMS-Admins,OU=Groups,DC=corp,DC=com"    # ← placeholder, set real DN
  LDAP_GROUP_MANAGER: "CN=MODMS-Managers,OU=Groups,DC=corp,DC=com"  # ← placeholder, set real DN
  LDAP_GROUP_FLOATER: "CN=MODMS-Floaters,OU=Groups,DC=corp,DC=com"  # ← placeholder, set real DN
  LDAP_GROUP_MFU:      "CN=MODMS-MFU,OU=Groups,DC=corp,DC=com"      # ← placeholder, set real DN
  USE_HTTPS: "false"                                # "false" = OpenShift Router terminates TLS; "true" = pod-level TLS (passthrough Route)
  # Shares the auth cookies across mgo-backend-<ns>.apps.<domain> and
  # mgo-backend-ws-<ns>.apps.<domain> — needed since we can't set an explicit
  # Route host and both auto-generated hostnames only share this suffix.
  # Must start with a leading dot. Leave unset if you ever do get a single
  # shared hostname for both Routes.
  COOKIE_DOMAIN: ".apps.your-cluster.com"           # ← placeholder, set your real .apps domain
  # ── Azure AD (Entra ID) SSO ──
  # App Registration values. None of these are secret — the client secret lives
  # in mgo-backend-secret. AZURE_REDIRECT_URI must match the Redirect URI
  # registered on the app *exactly*, including scheme and path.
  AZURE_TENANT_ID: "00000000-0000-0000-0000-000000000000"   # ← Directory (tenant) ID
  AZURE_CLIENT_ID: "00000000-0000-0000-0000-000000000000"   # ← Application (client) ID
  AZURE_REDIRECT_URI: "https://mgo-backend-7372268-test.apps.rtpfs-wpp2.wpp.nam.gm.com/api/azure_callback"
  # Entra group Object IDs (GUIDs, not DNs) -> app role, same priority order as
  # the LDAP_GROUP_* set above: admin > manager > floater > mfu.
  AZURE_GROUP_ADMIN:   "00000000-0000-0000-0000-000000000000"
  AZURE_GROUP_MANAGER: "00000000-0000-0000-0000-000000000000"
  AZURE_GROUP_FLOATER: "00000000-0000-0000-0000-000000000000"
  AZURE_GROUP_MFU:     "00000000-0000-0000-0000-000000000000"
