apiVersion: v1
kind: ConfigMap
metadata:
  name: mgo-backend-config
  namespace: 7372268-test          # ← your namespace
data:
  NEO4J_URI: "bolt://neo4j-service:7687"           # ← Neo4j bolt address (in-cluster service or external)
  NEO4J_USER: "neo4j"
  LDAP_BASE_DN: "DC=corp,DC=com"                   # ← your AD base DN
  LDAP_USER_SEARCH_BASE: "OU=Users,DC=corp,DC=com" # ← where users live in AD
  # AD group DN -> app role. A user must be a member of one of these to log
  # in at all — no match means login is denied. If a user is in more than
  # one, the highest-privilege role wins (admin > manager > floater > mfu).
  LDAP_GROUP_ADMIN:   "CN=MODMS-Admins,OU=Groups,DC=corp,DC=com"    # ← placeholder, set real DN
  LDAP_GROUP_MANAGER: "CN=MODMS-Managers,OU=Groups,DC=corp,DC=com"  # ← placeholder, set real DN
  LDAP_GROUP_FLOATER: "CN=MODMS-Floaters,OU=Groups,DC=corp,DC=com"  # ← placeholder, set real DN
  LDAP_GROUP_MFU:      "CN=MODMS-MFU,OU=Groups,DC=corp,DC=com"      # ← placeholder, set real DN
  USE_HTTPS: "false"                                # "false" = OpenShift Router terminates TLS; "true" = pod-level TLS (passthrough Route)
